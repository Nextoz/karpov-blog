{{- if gt (len .AllTranslations) 1 -}}
  {{- with index (where .AllTranslations "Lang" "da") 0 -}}
    <link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
  {{- end -}}
{{- else if .IsHome -}}
  <link rel="alternate" hreflang="x-default" href="{{ site.Home.Permalink }}">
{{- end -}}

<meta name="author" content="Evgeny Karpov">
