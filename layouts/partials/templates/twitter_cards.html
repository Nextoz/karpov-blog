{{- /* Site override of PaperMod's Twitter card partial: same title and share image as Open Graph. */ -}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ partial "og-image.html" . }}">
<meta name="twitter:title" content="{{ partial "page-title.html" . }}">
{{- with or .Description .Summary site.Params.description | plainify | htmlUnescape }}
<meta name="twitter:description" content="{{ trim . "\n\r\t " }}">
{{- end }}
