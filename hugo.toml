defaultContentLanguageInSubdir = false
baseURL = "https://nextoz.github.io/karpov-blog/"
locale = "da-DK"
defaultContentLanguage = "da"
title = "Evgeny Karpov"
theme = "PaperMod"
ignoreLogs = ["warning-goldmark-raw-html"]
enableRobotsTXT = true
buildDrafts = false

[pagination]
pagerSize = 10
[markup.goldmark.renderer]
unsafe = true

[params]

ShowLanguageSwitcher = true
env = "production"
title = "Evgeny Karpov"
description = "Engineering notes fra København om DevOps, platform engineering, .NET, observability og AI-systemer, der skal fungere i produktion."
author = "Evgeny Karpov"
images = ["images/profile.png"]
mainSections = ["posts"]
DateFormat = "2. January 2006"
defaultTheme = "dark"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = true
ShareButtons = ["linkedin", "x", "reddit"]
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
hidemeta = false
hideSummary = false
showtoc = true

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/evgenykarpov91/"

[[params.socialIcons]]
name = "github"
url = "https://github.com/Nextoz"

[[params.socialIcons]]
name = "email"
url = "mailto:evkar91@gmail.com"

[params.analytics]
# google = "G-XXXXXXXXXX"

[params.analytics.google]
# Paste the Search Console HTML tag content here after Google provides it.
# Example: SiteVerificationTag = "abc123"
SiteVerificationTag = ""

[params.label]
text = "Evgeny Karpov"
icon = "images/profile.png"
iconHeight = 38

[params.profileMode]
enabled = false

[params.assets]
disableFingerprinting = false
favicon = "images/karpov-mark.svg"
favicon16x16 = "images/profile.png"
favicon32x32 = "images/profile.png"
apple_touch_icon = "images/profile.png"
safari_pinned_tab = "images/karpov-mark.svg"

[params.schema]
publisherType = "Person"
sameAs = [
  "https://www.linkedin.com/in/evgenykarpov91/",
  "https://github.com/Nextoz"
]

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

[outputs]
home = ["HTML", "RSS", "JSON", "SITEMAP"]

[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.7

[markup]

[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"

