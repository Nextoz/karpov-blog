  da:
    name: Repo Radar
    status: Under opbygning, åben kode
    summary: Et tidligt varsel for open source. Den følger tusindvis af nye repositories, gemmer deres stjernetal hver tredje time og skal vise dem, der begynder at vokse, flere dage før de når GitHub Trending. Indsamlingen kører; dashboardet er næste skridt.
  en:
    name: Repo Radar
    status: In progress, open source
    summary: An early warning for open source. It watches thousands of new repositories, records their star counts every three hours and is meant to show the ones that start to grow, days before they reach GitHub Trending. The collector runs; the dashboard is next.

