<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">Vault Companion — architecture</title><desc id="desc">Mobile app, API and versioned notes. Desktop sync connects local notes, Obsidian and AI scouts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#91a7c4" stroke-width="1.5"/></marker></defs><rect width="900" height="740" rx="20" fill="#0b1423"/><g font-family="Arial, sans-serif"><text x="36" y="48" fill="#81a8ff" font-size="15" font-weight="700" letter-spacing="2">VAULT COMPANION / DATA AND RESPONSIBILITY</text><text x="36" y="91" fill="#f3f6fc" font-size="32" font-weight="700">Your notes. Several ways in.</text><rect x="24" y="128" width="852" height="274" rx="18" fill="#111e31"/><text x="44" y="159" fill="#94a9c5" font-size="15" letter-spacing="1.5">APP AND PROTECTED ACCESS</text><rect x="44" y="186" width="230" height="96" rx="14" fill="#172337" stroke="#5f91ff" stroke-width="1.5"/><text x="66" y="224" fill="#f3f6fc" font-size="24" font-weight="700">React PWA</text><text x="66" y="255" fill="#b5c4d9" font-size="18">UI + local queue</text><rect x="335" y="186" width="255" height="96" rx="14" fill="#172337" stroke="#5f91ff" stroke-width="1.5"/><text x="357" y="224" fill="#f3f6fc" font-size="24" font-weight="700">Worker API</text><text x="357" y="255" fill="#b5c4d9" font-size="18">Access · Hono</text><rect x="650" y="186" width="205" height="96" rx="14" fill="#172337" stroke="#5f91ff" stroke-width="1.5"/><text x="672" y="224" fill="#f3f6fc" font-size="24" font-weight="700">GitHub</text><text x="672" y="255" fill="#b5c4d9" font-size="18">Private vault · Git</text><g fill="none" stroke="#91a7c4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M280 234H329"/><path d="M596 234H644"/><path d="M752 288V361H463V464"/></g><text x="484" y="350" fill="#b5c4d9" font-size="18">Desktop synchronisation</text><rect x="24" y="426" width="852" height="230" rx="18" fill="#111e31"/><path d="M463 420V474" fill="none" stroke="#91a7c4" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="456" fill="#94a9c5" font-size="15" letter-spacing="1.5">ON MY COMPUTER</text><rect x="44" y="480" width="230" height="96" rx="14" fill="#172337" stroke="#5f91ff" stroke-width="1.5"/><text x="66" y="518" fill="#f3f6fc" font-size="24" font-weight="700">Obsidian</text><text x="66" y="549" fill="#b5c4d9" font-size="18">Read and edit</text><rect x="335" y="480" width="255" height="96" rx="14" fill="#172337" stroke="#5f91ff" stroke-width="1.5"/><text x="357" y="518" fill="#f3f6fc" font-size="24" font-weight="700">Local vault</text><text x="357" y="549" fill="#b5c4d9" font-size="18">Markdown</text><rect x="650" y="480" width="205" height="96" rx="14" fill="#172337" stroke="#57c7ba" stroke-width="1.5"/><text x="672" y="518" fill="#f3f6fc" font-size="24" font-weight="700">Scouts</text><text x="672" y="549" fill="#b5c4d9" font-size="18">Scheduled jobs</text><g fill="none" stroke="#91a7c4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M280 528H329"/><path d="M596 528H644"/><path d="M752 582V676"/></g><text x="44" y="625" fill="#b5c4d9" font-size="18">Notes and results remain readable outside the app UI.</text><rect x="650" y="684" width="205" height="38" rx="10" fill="#163833" stroke="#57c7ba"/><text x="752" y="710" text-anchor="middle" fill="#a5eee0" font-size="18">AI model API</text><text x="36" y="705" fill="#94a9c5" font-size="16">AI suggests · code validates · I decide</text></g></svg>